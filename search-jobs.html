<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Jobs | CareerNest</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#f6f4ef;
    color:#202731;
}

.layout{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:240px;
    background:#17202a;
    color:white;
    padding:28px 18px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    font-size:27px;
    font-weight:bold;
    padding:0 15px 45px;
}

.logo span{
    color:#a999ff;
}

.menu-title{
    color:#7f8994;
    font-size:10px;
    letter-spacing:2px;
    padding:0 15px 12px;
    font-weight:bold;
}

.menu a{
    display:block;
    color:#c3cad1;
    text-decoration:none;
    padding:14px 15px;
    margin:5px 0;
    border-radius:9px;
    font-size:14px;
}

.menu a:hover,
.menu a.active{
    background:#2d3947;
    color:white;
}

.logout{
    position:absolute;
    bottom:25px;
    left:18px;
    right:18px;
}

.main{
    margin-left:240px;
    width:calc(100% - 240px);
    padding:45px;
}

.back{
    color:#7657e8;
    text-decoration:none;
    font-size:13px;
}

.small{
    color:#7657e8;
    font-size:11px;
    letter-spacing:2px;
    font-weight:bold;
    margin-top:25px;
}

h1{
    font-size:38px;
    margin:8px 0;
}

.subtitle{
    color:#777;
    margin-bottom:30px;
}

.search-panel{
    background:white;
    border:1px solid #e4e1db;
    border-radius:16px;
    padding:22px;
    display:grid;
    grid-template-columns:2fr 1fr auto;
    gap:12px;
    margin-bottom:28px;
}

input,select{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
}

input:focus,select:focus{
    border-color:#7657e8;
}

.search-btn{
    background:#7657e8;
    color:white;
    border:0;
    border-radius:9px;
    padding:0 25px;
    font-weight:bold;
    cursor:pointer;
}

.search-btn:hover{
    background:#6044cf;
}

.heading{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.heading h2{
    font-size:21px;
}

.heading span{
    color:#777;
    font-size:13px;
}

.jobs{
    display:grid;
    gap:15px;
}

.job{
    background:white;
    border:1px solid #e4e1db;
    border-radius:15px;
    padding:24px;
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.job h3{
    font-size:19px;
    margin-bottom:5px;
}

.company{
    color:#7657e8;
    font-size:13px;
    font-weight:bold;
}

.tags{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:13px 0;
}

.tags span{
    background:#f0eeea;
    color:#666;
    padding:6px 10px;
    border-radius:5px;
    font-size:11px;
}

.salary{
    font-weight:bold;
    font-size:13px;
}

.skills{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.actions{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:9px;
    min-width:120px;
}

.actions button{
    border:0;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.apply{
    background:#17202a;
    color:white;
}

.save{
    background:#eeeaff;
    color:#7657e8;
}

.empty{
    background:white;
    padding:50px;
    text-align:center;
    border-radius:15px;
    color:#777;
}

@media(max-width:800px){

    .sidebar{
        width:75px;
        padding:25px 8px;
    }

    .logo{
        font-size:0;
        text-align:center;
        padding:0 0 40px;
    }

    .logo:after{
        content:"CN";
        font-size:18px;
    }

    .menu-title{
        display:none;
    }

    .menu a{
        font-size:0;
        text-align:center;
        padding:15px 5px;
    }

    .menu a span{
        font-size:20px;
    }

    .main{
        margin-left:75px;
        width:calc(100% - 75px);
        padding:25px 18px;
    }

    .search-panel{
        grid-template-columns:1fr;
    }

    .search-btn{
        padding:14px;
    }

    .job{
        flex-direction:column;
    }

    .actions{
        flex-direction:row;
    }

    h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">

    <div class="logo">
        Career<span>Nest</span>
    </div>

    <div class="menu-title">MAIN MENU</div>

    <div class="menu">

        <a href="dashboard.html">🏠 Dashboard</a>

        <a href="search-jobs.html" class="active">
            🔎 Search Jobs
        </a>

        <a href="apply.html">
            📝 Apply for Job
        </a>

        <a href="saved.html">
            💾 Saved Jobs
        </a>

        <a href="views.html">
            👁 My Requests
        </a>

    </div>

    <a href="index.html" class="menu logout">
        ↩ Logout
    </a>

</aside>


<main class="main">

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

    <div class="small">JOB DISCOVERY</div>

    <h1>Search Jobs</h1>

    <p class="subtitle">
        Discover opportunities that match your skills and career goals.
    </p>


    <div class="search-panel">

        <input
            type="text"
            id="search"
            placeholder="Search job, company or skill..."
        >

        <select id="location">
            <option value="all">All Locations</option>
            <option>Chennai</option>
            <option>Bangalore</option>
            <option>Hyderabad</option>
            <option>Remote</option>
        </select>

        <button class="search-btn" onclick="searchJobs()">
            Search Jobs
        </button>

    </div>


    <div class="heading">

        <h2>Available Opportunities</h2>

        <span id="count">6 jobs available</span>

    </div>


    <div id="jobs" class="jobs"></div>

</main>

</div>


<script>

const jobs = [

{
id:1,
title:"Software Developer",
company:"TechNova Solutions",
location:"Chennai",
type:"Full Time",
mode:"Hybrid",
salary:"₹6L – ₹10L / year",
skills:"Java, Python, SQL"
},

{
id:2,
title:"Frontend Developer",
company:"PixelWorks",
location:"Remote",
type:"Full Time",
mode:"Remote",
salary:"₹5L – ₹8L / year",
skills:"HTML, CSS, JavaScript"
},

{
id:3,
title:"Java Developer",
company:"CloudMatrix",
location:"Bangalore",
type:"Full Time",
mode:"Hybrid",
salary:"₹7L – ₹12L / year",
skills:"Java, Spring Boot, MySQL"
},

{
id:4,
title:"Data Analyst",
company:"Insight Labs",
location:"Hyderabad",
type:"Full Time",
mode:"Office",
salary:"₹5L – ₹9L / year",
skills:"Python, Excel, SQL"
},

{
id:5,
title:"Web Developer Intern",
company:"InnovateHub",
location:"Chennai",
type:"Internship",
mode:"Hybrid",
salary:"₹15K – ₹25K / month",
skills:"HTML, CSS, JavaScript"
},

{
id:6,
title:"Python Developer",
company:"NextGen Technologies",
location:"Remote",
type:"Full Time",
mode:"Remote",
salary:"₹6L – ₹11L / year",
skills:"Python, Django, SQL"
}

];


function showJobs(list){

    const container=document.getElementById("jobs");

    document.getElementById("count").textContent=
        list.length+" jobs available";

    if(list.length===0){

        container.innerHTML=`
            <div class="empty">
                <h3>No jobs found</h3>
                <p>Try another job title, skill or location.</p>
            </div>
        `;

        return;
    }

    container.innerHTML=list.map(job=>`

        <div class="job">

            <div>

                <h3>${job.title}</h3>

                <div class="company">
                    ${job.company}
                </div>

                <div class="tags">
                    <span>📍 ${job.location}</span>
                    <span>${job.type}</span>
                    <span>${job.mode}</span>
                </div>

                <div class="salary">
                    ${job.salary}
                </div>

                <div class="skills">
                    Skills: ${job.skills}
                </div>

            </div>


            <div class="actions">

                <button
                    class="apply"
                    onclick="applyJob(${job.id})">
                    Apply Now
                </button>

                <button
                    class="save"
                    onclick="saveJob(${job.id})">
                    ♡ Save Job
                </button>

            </div>

        </div>

    `).join("");
}


function searchJobs(){

    const text=
        document.getElementById("search")
        .value
        .toLowerCase();

    const location=
        document.getElementById("location")
        .value;

    const result=jobs.filter(job=>{

        const allText=(
            job.title+" "+
            job.company+" "+
            job.skills+" "+
            job.location
        ).toLowerCase();

        const textMatch=allText.includes(text);

        const locationMatch=
            location==="all" ||
            job.location===location;

        return textMatch && locationMatch;
    });

    showJobs(result);
}


function applyJob(id){

    localStorage.setItem("selectedJob",id);

    window.location.href="apply.html";
}


function saveJob(id){

    let saved=
        JSON.parse(localStorage.getItem("savedJobs")) || [];

    if(!saved.includes(id)){

        saved.push(id);

        localStorage.setItem(
            "savedJobs",
            JSON.stringify(saved)
        );

        alert("✓ Job saved successfully!");

    }else{

        alert("This job is already saved.");

    }
}


showJobs(jobs);

</script>

</body>
</html>
